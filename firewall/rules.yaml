# firewall/rules.yaml: limits and allowlist (Person 2 owns)
# Precedence: any deny wins, otherwise any ask, otherwise allow. Default is deny.
auto_limit: "50"        # TUSD: at or below this, an allowlisted transfer is auto-approved
max_tx: "500"           # TUSD: above this, always deny (LIM-01)
daily_cap: "1000"       # TUSD per rolling 24h (LIM-03)
velocity:
  max_actions: 5
  window_seconds: 600   # VEL-01
trusted_origins:
  - user_chat           # everything else is untrusted (PRV-01)
chain_id: null          # set after the first deploy; read from the node, never guess
allowlist:            # add checksummed addresses here, e.g. a demo "Alice" and "Bob"
  - "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"   # Alice (Anvil account #1)
  - "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"   # Bob (Anvil account #2)